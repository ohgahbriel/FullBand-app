<!doctype html>
<html>
<head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:transparent;width:100%;height:100%}
  svg{display:block;width:100vw;height:100vh}
</style></head>
<body>
<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="amb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc874"/>
      <stop offset="1" stop-color="#f0a43c"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- rounded app tile -->
  <rect x="6" y="6" width="244" height="244" rx="56" fill="url(#bg)" stroke="#333" stroke-width="2"/>

  <!-- three mixer faders (bottom-anchored), amber with bloom -->
  <g filter="url(#glow)" fill="url(#amb)">
    <rect x="56"  y="66"  width="34" height="124" rx="17"/>
    <rect x="111" y="114" width="34" height="76"  rx="17"/>
    <rect x="166" y="90"  width="34" height="100" rx="17"/>
  </g>

  <!-- fader caps (bright handles) -->
  <g fill="#fff8ec">
    <rect x="50"  y="78"  width="46" height="12" rx="6"/>
    <rect x="105" y="126" width="46" height="12" rx="6"/>
    <rect x="160" y="102" width="46" height="12" rx="6"/>
  </g>
</svg>
</body>
</html>
