<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0d16" />
    <title>FullBand</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- ===== Landing: paste a link ===== -->
    <section id="setup" class="setup">
      <h1 class="logo">Full<span>Band</span></h1>
      <p class="tagline">Paste a YouTube link — get a full mixer with every instrument on its own fader.</p>
      <form id="urlForm" class="url-row">
        <input id="url" type="url" inputmode="url" placeholder="https://youtube.com/watch?v=…" autocomplete="off" />
        <button id="go" type="submit">Separate</button>
      </form>
      <p id="status" class="status"></p>
      <div id="progressWrap" class="progress-wrap" hidden>
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <span id="device" class="device" title="separation backend — tap to change"></span>
    </section>

    <!-- ===== Player: the Jamzone-style mixer ===== -->
    <section id="player" class="player" hidden>
      <header class="player-top">
        <span id="elapsed" class="t-elapsed">0:00</span>
        <span id="nowPlaying" class="t-title">—</span>
        <span id="remain" class="t-remain">-0:00</span>
        <button id="back" class="back" title="New song">✕</button>
      </header>

      <div class="stage">
        <canvas id="wave" class="wave"></canvas>
        <div class="transport">
          <button id="restart" class="t-btn" title="Back to start">⏮</button>
          <button id="playPause" class="play-btn" title="Play / pause">▶</button>
        </div>
      </div>

      <div class="infobar">
        <span class="chip metro"><span id="beatDot" class="beat-dot"></span> <span class="chip-k">BEAT</span></span>
        <span class="chip stepper">
          <span class="chip-k">KEY</span>
          <button id="keyDown" class="step" title="Transpose down a semitone">−</button>
          <span id="key" class="step-val" title="Double-click to reset">—</span>
          <button id="keyUp" class="step" title="Transpose up a semitone">+</button>
        </span>
        <span class="chip stepper">
          <button id="tempoDown" class="step" title="Slower">−</button>
          <span id="bpm" class="step-val" title="Double-click to reset">—</span>
          <span class="chip-k">BPM</span>
          <button id="tempoUp" class="step" title="Faster">+</button>
        </span>
        <span class="ib-spacer"></span>
        <span id="exportMsg" class="export-msg"></span>
        <select id="fmt" class="fmt" title="mix format">
          <option value="mp3">MP3</option>
          <option value="wav">WAV</option>
          <option value="flac">FLAC</option>
          <option value="ogg">OGG</option>
          <option value="m4a">M4A</option>
        </select>
        <button id="saveMix" class="exp" title="Save the current mix">⬇ Mix</button>
        <button id="saveZip" class="exp" title="Download every stem in a zip">⬇ Stems .zip</button>
        <span id="device2" class="chip device" title="separation backend — tap to change"></span>
      </div>

      <div id="mixer" class="mixer">
        <div id="tracks" class="tracks"></div>
        <div class="strip master" id="masterStrip">
          <div class="fader">
            <input id="master" class="vol" type="range" min="0" max="1" step="0.01" value="1" />
          </div>
          <button class="mute placeholder" disabled></button>
          <div class="strip-icon">🎚️</div>
          <div class="strip-label">Master</div>
        </div>
      </div>
    </section>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
