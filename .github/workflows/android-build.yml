name: Build Android APK

# Builds the FullBand mixer into an installable debug APK in the cloud,
# so no local Android SDK is needed. Run from the Actions tab, or on a tag.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web bundle + create Android project
        run: |
          npm run build
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Assemble debug APK
        working-directory: web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: fullband-debug-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
